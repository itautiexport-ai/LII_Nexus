<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="100%" stop-color="#e0f7fa"/>
    </linearGradient>
    <path id="confetti1" d="M0,0 L10,5 L5,15 Z" fill="#ff4081"/>
    <path id="confetti2" d="M0,0 L15,0 L10,10 Z" fill="#7c4dff"/>
    <path id="confetti3" d="M0,0 L10,10 L0,15 Z" fill="#00e5ff"/>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Balloons / Decorations -->
  <g opacity="0.6">
    <!-- Top Left -->
    <circle cx="50" cy="50" r="40" fill="#ffb74d" opacity="0.8"/>
    <circle cx="100" cy="30" r="30" fill="#ba68c8" opacity="0.8"/>
    <circle cx="20" cy="100" r="25" fill="#4dd0e1" opacity="0.8"/>
    
    <!-- Top Right -->
    <circle cx="750" cy="60" r="45" fill="#f06292" opacity="0.8"/>
    <circle cx="700" cy="30" r="20" fill="#aed581" opacity="0.8"/>
    <circle cx="780" cy="120" r="35" fill="#64b5f6" opacity="0.8"/>
    
    <!-- Bottom Left -->
    <circle cx="60" cy="1050" r="50" fill="#ff8a65" opacity="0.8"/>
    <circle cx="120" cy="1080" r="30" fill="#4db6ac" opacity="0.8"/>
    
    <!-- Bottom Right -->
    <circle cx="760" cy="1060" r="40" fill="#9575cd" opacity="0.8"/>
    <circle cx="700" cy="1090" r="25" fill="#f06292" opacity="0.8"/>
  </g>
  
  <!-- Confetti -->
  <g opacity="0.7">
    <use href="#confetti1" x="200" y="100" transform="rotate(45 200 100)"/>
    <use href="#confetti2" x="400" y="50" transform="rotate(15 400 50)"/>
    <use href="#confetti3" x="600" y="150" transform="rotate(75 600 150)"/>
    <use href="#confetti1" x="150" y="300" transform="rotate(120 150 300)"/>
    <use href="#confetti2" x="700" y="400" transform="rotate(30 700 400)"/>
    
    <use href="#confetti3" x="100" y="800" transform="rotate(60 100 800)"/>
    <use href="#confetti1" x="250" y="950" transform="rotate(15 250 950)"/>
    <use href="#confetti2" x="550" y="1000" transform="rotate(105 550 1000)"/>
    <use href="#confetti3" x="700" y="850" transform="rotate(20 700 850)"/>
  </g>
  
  <!-- White overlay for text readability -->
  <rect x="40" y="56" width="720" height="1008" fill="#ffffff" opacity="0.85" rx="15"/>
</svg>
