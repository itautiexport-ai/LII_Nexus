<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f8e9"/>
    </linearGradient>
    <path id="leaf" d="M0,20 C0,0 20,0 20,20 C20,40 0,40 0,20 Z" fill="#81c784"/>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Subtle elegant background circles and waves -->
  <g opacity="0.3">
    <circle cx="0" cy="0" r="350" fill="#b2ebf2" opacity="0.4"/>
    <circle cx="800" cy="1120" r="400" fill="#c8e6c9" opacity="0.4"/>
    <circle cx="800" cy="0" r="250" fill="#fff9c4" opacity="0.3"/>
    <circle cx="0" cy="1120" r="250" fill="#e1bee7" opacity="0.2"/>
  </g>
  
  <!-- Decorative elements like leaves -->
  <g opacity="0.5">
    <use href="#leaf" x="50" y="80" transform="scale(1.5) rotate(45)"/>
    <use href="#leaf" x="650" y="100" transform="scale(2) rotate(-30)"/>
    <use href="#leaf" x="720" y="950" transform="scale(1.8) rotate(120)"/>
    <use href="#leaf" x="120" y="1000" transform="scale(1.2) rotate(60)"/>
    <use href="#leaf" x="700" y="400" transform="scale(1) rotate(15)"/>
    <use href="#leaf" x="80" y="500" transform="scale(1.5) rotate(-45)"/>
  </g>

  <!-- Bunting/Flags at the top -->
  <g opacity="0.6">
    <path d="M 100 50 Q 250 150 400 50 Q 550 150 700 50" fill="none" stroke="#b0bec5" stroke-width="2"/>
    <polygon points="150,90 170,140 190,90" fill="#ffab91"/>
    <polygon points="250,118 270,168 290,118" fill="#ce93d8"/>
    <polygon points="350,110 370,160 390,110" fill="#81c784"/>
    <polygon points="450,118 470,168 490,118" fill="#64b5f6"/>
    <polygon points="550,90 570,140 590,90" fill="#ffd54f"/>
  </g>

  <!-- White overlay for text readability -->
  <rect x="40" y="56" width="720" height="1008" fill="#ffffff" opacity="0.85" rx="15"/>
</svg>
