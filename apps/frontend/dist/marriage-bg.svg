<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="100%" stop-color="#fce4ec"/>
    </linearGradient>
    <path id="heart" d="M10,30 A20,20,0,0,1,50,30 A20,20,0,0,1,90,30 Q90,60,50,90 Q10,60,10,30 Z" fill="#f48fb1"/>
    <circle id="ring" cx="50" cy="50" r="30" stroke="#fbc02d" stroke-width="4" fill="none"/>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Subtle elegant background circles -->
  <g opacity="0.3">
    <circle cx="0" cy="0" r="400" fill="#f8bbd0" opacity="0.4"/>
    <circle cx="800" cy="1120" r="350" fill="#f48fb1" opacity="0.2"/>
    <circle cx="800" cy="0" r="300" fill="#ffcdd2" opacity="0.3"/>
    <circle cx="0" cy="1120" r="250" fill="#fce4ec" opacity="0.5"/>
  </g>
  
  <!-- Hearts -->
  <g opacity="0.6">
    <use href="#heart" x="50" y="50" transform="scale(0.8) rotate(-15)"/>
    <use href="#heart" x="650" y="80" transform="scale(1.2) rotate(20)"/>
    <use href="#heart" x="720" y="1000" transform="scale(0.9) rotate(-25)"/>
    <use href="#heart" x="80" y="950" transform="scale(1.5) rotate(15)"/>
    <use href="#heart" x="120" y="150" transform="scale(0.5) rotate(45)"/>
    <use href="#heart" x="600" y="1050" transform="scale(0.7) rotate(-10)"/>
  </g>
  
  <!-- Rings -->
  <g opacity="0.4">
    <use href="#ring" x="600" y="40" transform="scale(1.5)"/>
    <use href="#ring" x="630" y="60" transform="scale(1.5)"/>
    
    <use href="#ring" x="40" y="900" transform="scale(2)"/>
    <use href="#ring" x="80" y="930" transform="scale(2)"/>
  </g>

  <!-- White overlay for text readability -->
  <rect x="40" y="56" width="720" height="1008" fill="#ffffff" opacity="0.85" rx="15"/>
</svg>
