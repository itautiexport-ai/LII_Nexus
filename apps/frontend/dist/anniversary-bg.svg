<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#cfd9df"/>
    </linearGradient>
    <path id="star" d="M10,0 L13,6 L20,7 L15,12 L16,19 L10,16 L4,19 L5,12 L0,7 L7,6 Z" fill="#ffd700"/>
    <path id="ribbon" d="M0,0 Q10,10 20,0 T40,0" stroke="#fbc02d" fill="none" stroke-width="2"/>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Subtle geometric background / elegance -->
  <g opacity="0.4">
    <circle cx="0" cy="0" r="300" fill="#a1c4fd" opacity="0.3"/>
    <circle cx="800" cy="1120" r="400" fill="#c2e9fb" opacity="0.3"/>
    <circle cx="800" cy="0" r="250" fill="#ffecd2" opacity="0.4"/>
    <circle cx="0" cy="1120" r="350" fill="#fcb69f" opacity="0.3"/>
  </g>
  
  <!-- Stars -->
  <g opacity="0.8">
    <use href="#star" x="80" y="60" transform="scale(1.5)" opacity="0.7"/>
    <use href="#star" x="650" y="100" transform="scale(0.8) rotate(15)"/>
    <use href="#star" x="720" y="40" transform="scale(2) rotate(45)"/>
    <use href="#star" x="120" y="150" transform="scale(1.2) rotate(-20)"/>
    
    <use href="#star" x="60" y="1000" transform="scale(1.8) rotate(30)"/>
    <use href="#star" x="150" y="1060" transform="scale(1) rotate(-10)"/>
    <use href="#star" x="700" y="980" transform="scale(1.5) rotate(70)"/>
    <use href="#star" x="650" y="1080" transform="scale(1.2) rotate(10)"/>
  </g>
  
  <!-- Ribbons -->
  <g opacity="0.6">
    <use href="#ribbon" x="50" y="120" transform="scale(2) rotate(15)"/>
    <use href="#ribbon" x="650" y="150" transform="scale(2.5) rotate(-30)"/>
    <use href="#ribbon" x="100" y="950" transform="scale(2.2) rotate(-15)"/>
    <use href="#ribbon" x="600" y="1050" transform="scale(1.8) rotate(45)"/>
  </g>

  <!-- White overlay for text readability -->
  <rect x="40" y="56" width="720" height="1008" fill="#ffffff" opacity="0.85" rx="15"/>
</svg>
